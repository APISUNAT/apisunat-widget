name: Publicar paquete en npm

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      # 1. Clona el código usando la versión más reciente v4
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      # 2. Configura Node.js v22 (LTS) y enlaza el registro oficial
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npmjs.org'

      - name: Instalar dependencias
        run: npm ci

      - name: Publicar en npmRegistry
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}